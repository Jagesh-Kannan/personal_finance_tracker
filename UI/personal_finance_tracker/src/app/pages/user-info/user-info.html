<div class="user-info-container">
  <div class="profile-layout" [skeletonLoader]="userInfoLoader()">
    
    <!-- Profile Card -->
    <div class="profile-card">
      <div class="avatar-large skeleton-loader">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1.5">
          <circle cx="12" cy="8" r="5" />
          <path d="M20 21a8 8 0 0 0-16 0" />
        </svg>
      </div>
      <h2 class="user-full-name skeleton-loader">{{ userData().firstName }} {{ userData().lastName }}</h2>
      <p class="user-id skeleton-loader">ID: {{ userData()._id }}</p>
      
      <div class="status-badge skeleton-loader" [class.verified]="userData().emailVerified">
        {{ userData().emailVerified ? 'Verified Account' : 'Unverified' }}
      </div>
    </div>

    <!-- Details Section -->
    <div class="details-section">
      <h3 class="section-title">Account Details</h3>
      
      <div class="info-grid">
        <div class="info-item skeleton-loader">
          <label>First Name</label>
          <span>{{ userData().firstName }}</span>
        </div>
        <div class="info-item skeleton-loader">
          <label>Last Name</label>
          <span>{{ userData().lastName }}</span>
        </div>
        <div class="info-item full-width skeleton-loader">
          <label>Email Address</label>
          <div class="email-row">
            <span>{{ userData().email }}</span>
            @if (userData().emailVerified) {
              <svg class="verify-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            }
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
