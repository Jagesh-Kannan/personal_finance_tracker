<div class="page-container overview-container"
     (touchstart)="onTouchStart($event)"
     (touchmove)="onTouchMove($event)"
     (touchend)="onTouchEnd($event)"
     (wheel)="onDesktopWheel($event)">
  
  <div class="page-container-wrapper overview-wrapper">
    <div class="title-container">
      <!-- Title & Dropdown markup remains completely identical to your original -->
      <div class="title-wrapper">
        <h1 class="welcome-title">
          <label for="welcome-title" class="welcome-word">Hello</label>
          <label for="welcome-title" class="welcome-name">{{ this.user_detail().first_name }}</label>
        </h1>
        <p class="welcome-description">Hope you are doing well. Find insights of your expenses below.</p>
      </div>
      <div class="dropdown-wrapper">
        <label class="custom-label" for="monthSelect">Target Period</label>
        <div class="select-container">
          <select id="monthSelect" class="custom-select" [formControl]="monthControl" name="monthSelect">
            @for (month of monthOptions(); track month.value) {
              <option [value]="month.value">{{ month.displayName }}</option>
            }
          </select>
          <div class="select-arrow"></div>
        </div>
        <div class="actions">
          <div class="filter"><button title="Filter" (click)="openOverviewFilter()"><svg lucideFunnel></svg></button></div>
        </div>
      </div>
    </div>

    <div class="overview-content">
      <div class="overview-content-wrapper">
        
        <!-- SECTION 1 & 2: Static Background Group -->
        <div class="static-bg-sections" [class.blurred-underneath]="isPanelExpanded()">
          <div class="statistics">
            <section class="section-1">
              <statistic-block [statisticsList]="this.quickInsightDetails().statisticDetail" [cardLoader]="this.statisticsLoader()"></statistic-block>
            </section>
            <section class="section-2">
              <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
            </section>
          </div>
        </div>

        <!-- SECTION 3: The Sliding Sheet Layer -->
        <div class="sliding-panel-container" 
             [class.expanded]="isPanelExpanded()"
             [style.transform]="panelTransform()">
          
          <section class="section-3" >
            <div class="dashboard-container">
              <div class="dashboard-wrapper hang-header-wrapper">
                 
                 <!-- Outward Fillet Header Tab -->
                 <div class="dash-header hang-header">
                   <div class="dash-title hang-title">Viz Insights</div>
                   <div class="drag-indicator-fallback"></div>
                 </div>
                 
                 <!-- Internal Scrollable Content Canvas -->
                 <div class="dash-content" #section3Container (scroll)="onInternalScroll($event)">
                    <div class="chart-container">
                      <!-- Your actual widgets/charts render cleanly in here -->
                       sdgsfddddddddddd
                       d
              <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
               <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                 <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                  <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                   <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                    <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                     <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>
                      <app-widget-block [widgetList]="this.quickInsightDetails().widgetDetails" [cardLoader]="this.statisticsLoader()"></app-widget-block>

                    </div>
                 </div>

              </div>
            </div>
          </section>

        </div>

      </div>
    </div>
  </div>
</div>







<!-- Slide-Up Form Component for Overview Filter -->
<app-slide-up-form
  [isOpen]="openFilterForm"
  [formType]="'overview-filter'"
  [formGroup]="overviewFilterForm"
  [titleWord]="'Filter'"
  [titleName]="'Expenses'"
  [description]="'Filter your expenses based on the selected criteria.'"
  [buttonText]="'Render Insights'"
  (onSubmit)="get_insights($event)"
  (onClose)="openFilterForm.set(false)"
></app-slide-up-form>
