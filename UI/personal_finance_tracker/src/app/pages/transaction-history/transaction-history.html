<div class="page-container transaction-history-container">
  <div class="page-container-wrapper transaction-history-wrapper">
    <div class="title-container">
      <div class="title-wrapper">
        <h1 class="welcome-title">
          <label for="welcome-title" class="welcome-word">your</label>
          <label for="welcome-title" class="welcome-name">Transactions</label>
        </h1>
        <p class="welcome-description">See all your transactions here.</p>
      </div>
    </div>
    <div class="transaction-details-container">
      <div class="transaction-details-wrapper">
        <div class="header">
          <h2>
            Overview <span class="count">( {{ filteredExpenseList().length }} )</span>
          </h2>
          <div class="header-actions">
            <div class="filter">
              <button title="Filter" (click)="openExpenseFilter()">
                <svg lucideFunnel></svg>
              </button>
            </div>
            <div class="delete" style="position: relative">
              <button title="Delete" (click)="isDeletePopoverOpen.set(!isDeletePopoverOpen())">
                <svg lucideTrash2></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="transaction-details-content">
         <app-expense-list-container [expenses]="filteredExpenseList()" class="extracted-expenses-list">
          <ng-template let-expense>
            <app-expense-list-card 
              [expense]="expense"
              [avatarText]="expense.senderOrReceiver"
              (cardClick)="enableSelectionMode() ? addOrRemoveExpense(expense) : null"
            >
  
              <svg avatar-fallback lucideCheck class="check-icon"></svg>

              <ng-container actions>
                @if (enableSelectionMode()) {
                  <button class="edit-btn" (click)="openEditExpenseForm(expense); $event.stopPropagation();">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" lucideEye></svg>
                  </button>
                } @else {
                  <button class="edit-btn" (click)="openEditExpenseForm(expense); $event.stopPropagation();">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
                    </svg>
                  </button>
                }
              </ng-container>
            </app-expense-list-card>
          </ng-template>
        </app-expense-list-container>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Popover -->
@if (isDeletePopoverOpen()) {
  <div class="popover-pointer delete-pointer"></div>
  <div class="delete-popover">
    <div class="popover-item-wrapper">
      @if (this.storeRemovedExpense().length > 0) {
        <div
          class="popover-item delete-option"
          (click)="initiate_delete_expenses('selected'); isDeletePopoverOpen.set(false); $event.stopPropagation()"
          [buttonLoader]="deleteExpenseLoader()"
        >
          <svg
            class="popover-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            lucideTrash2
          ></svg>
          <span>Delete Selected</span>
        </div>
      } @else {
        <div
          class="popover-item select-option"
          (click)="
            enableSelectionMode.set(true); isDeletePopoverOpen.set(false); $event.stopPropagation()
          "
        >
          <svg
            class="popover-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            lucideListChecks
          ></svg>
          <span>Select</span>
        </div>
      }

      <div class="popover-divider"></div>

      <div
        class="popover-item delete-option"
        (click)="initiate_delete_expenses('all'); isDeletePopoverOpen.set(false); $event.stopPropagation()"
      >
        <svg
          class="popover-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="8" y1="12" x2="16" y2="12" />
        </svg>
        <span>Delete All</span>
      </div>
    </div>
  </div>
}

<!-- Delete Popover Overlay -->
@if (isDeletePopoverOpen()) {
  <div class="popover-overlay" (click)="isDeletePopoverOpen.set(false)"></div>
}

<!-- Slide-Up Form Component for Manual Entry -->
<app-slide-up-form
  [isOpen]="openExpenseForm"
  [formType]="enableSelectionMode() ? 'view-transaction' : 'manual-entry'"
  [formGroup]="expenseForm"
  [titleWord]="enableSelectionMode() ? 'view' : 'modify'"
  [titleName]="'Expense'"
  [description]="'Modify/View the details to update your expense manually.'"
  [buttonText]="'Update Transaction'"
  (onSubmit)="initiate_update_expense()"
  (onClose)="openExpenseForm.set(false)"
></app-slide-up-form>

<!-- Slide-Up Form Component for Expense Filter-->
<app-slide-up-form
  [isOpen]="openFilterForm"
  [formType]="'transaction-filter'"
  [formGroup]="overviewFilterForm"
  [titleWord]="'filter'"
  [titleName]="'Expense'"
  [description]="'Filter your transactions based on the selected criteria.'"
  [buttonText]="'Apply'"
  (onSubmit)="filterExpenseList()"
  (onClose)="openFilterForm.set(false)"
></app-slide-up-form>
